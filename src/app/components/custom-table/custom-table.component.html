<div class="w-full h-full">

  <p-table [value]="listData" [columns]="listOfColumns" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
    [paginator]="true" class="w-full">
    <ng-template pTemplate="caption">
      <div class="flex">
        <div class="flex w-6 justify-content-start align-items-center">
          <h1>{{pageTitle}}</h1>
        </div>
        <div class="flex w-6 justify-content-end align-items-center">
          <app-custom-button [custom]="getCustomButton()" (onClickEvent)="novo()"></app-custom-button>
        </div>
      </div>

    </ng-template>

    <ng-template pTemplate="header" let-columns>
      <tr>
        <th *ngFor="let column of columns; let  i = index;">{{column.header}}</th>
        <th style="width: 100px;"></th>
      </tr>
      <tr>
        <th *ngFor="let filterColumn of columns; let i = index; trackBy:trackByFn">
          <p-columnFilter *ngIf="filterColumn.filter" type="text" [field]="filterColumn.field"></p-columnFilter>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data let-columns="columns">
      <tr>
        <td *ngFor="let col of columns">

          <ng-content *ngIf="col.field == 'status$descricao' && data['status']['descricao'] === 'Em aberto'">
            <p-tag severity="info" [value]="generateTableValues(data, col.field)">
            </p-tag>
          </ng-content>

          <ng-content *ngIf="col.field == 'status$descricao' && data['status']['descricao'] === 'Em atraso'">
            <p-tag severity="danger" [value]="generateTableValues(data, col.field)">
            </p-tag>
          </ng-content>

          <ng-content *ngIf="col.field == 'status$descricao' && data['status']['descricao'] === 'Finalizado'">
            <p-tag severity="success" [value]="generateTableValues(data, col.field)">
            </p-tag>
          </ng-content>

          <ng-content *ngIf="col.field !== 'status$descricao'">
            <span> {{ generateTableValues(data, col.field)}}</span>
          </ng-content>
        </td>
        <td class="flex">
          <p-button icon="pi pi-pencil" severity="info" size="small" [style]="{'max-width.px': 30}" [text]="true"
            (onClick)="editar(data.id)"></p-button>
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" class="mx-2"
            [style]="{'max-width.px': 30}" (onClick)="openDialog($event, data.id)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
