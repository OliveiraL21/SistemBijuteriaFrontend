<div class="w-full mb-5" *ngIf="controlData.isVisible" [formGroup]="form">
  <p-floatLabel class="w-full">
    <input type="text" pInputText [formControlName]="controlData.controlName" class="w-full"
      [id]="controlData.controlName" *ngIf="controlData.mask === '' || controlData.mask === undefined"
      (ngModelChange)="onInputChange($event)" />
    <p-inputMask [mask]="controlData.mask" [formControlName]="controlData.controlName" *ngIf="controlData.mask"
      class="w-full" styleClass="w-full" [id]="controlData.controlName"
      (ngModelChange)="onInputChange($event)"></p-inputMask>
    <label [for]="controlData.forLabel"><span *ngIf="controlData.required"
        class="text-red-600 mr-1">*</span>{{controlData.label}}</label>
  </p-floatLabel>
  <small *ngIf="form.get(controlData.controlName)?.hasError('required') && form.get(controlData.controlName)?.dirty"
    class="p-0 mb-4 mt-2 p-error block">
    Campo obrigatório
  </small>
  <small class="p-0 mb-4 mt-2 p-error block"
    *ngIf="form.get(controlData.controlName)?.hasError('email') && form.get(controlData.controlName)?.dirty">
    E-mail inválido
  </small>
</div>
