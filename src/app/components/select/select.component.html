<div class="w-full flex" [formGroup]="form">
  <p-floatLabel>
    <p-dropdown [options]="options" [optionLabel]="data.optionLabel" [optionValue]="data.optionValue"
      [filter]="data.filter" [filterBy]="data.filterBy" [showClear]="data.showClear" [placeholder]="data.placeholder">

      <ng-template pTemplate="filter" let-options="options">
        <div class="flex gap-1">
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
            <input type="text" pInputText placeholder="filter" [(ngModel)]="filterValue"
              (keyup)="customFilterFunction($event, options)">
          </div>
          <button pButton icon="pi pi-times" (click)="resetFunction(options)"></button>
        </div>
      </ng-template>

      <ng-template pTemplate="selectedItem" let-selectedOption>
        <div class="flex align-items-center gap-2">
          <div>{{ selectedOption[data.optionLabel] }}</div>
        </div>
      </ng-template>

      <ng-template let-item pTemplate="item">
        <div class="flex align-items-center gap-2">
          <div>{{ item[data.optionLabel] }}</div>
        </div>
      </ng-template>
    </p-dropdown>
    <label [for]="data.controlName">{{data.label}}</label>
  </p-floatLabel>
</div>
