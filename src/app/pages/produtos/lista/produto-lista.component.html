<div class="w-full  p-4 mt-5">
  <p-confirmDialog />
  <p-toast position="top-right" key="trCustom" />
  <p-blockUI [blocked]="loading">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="8" fill="var(--surface-ground)"
      animationDuration=".5s"></p-progressSpinner>
  </p-blockUI>
  <p-card>
    <app-custom-table [pageTitle]="'Produtos'" [pageName]="'Produto'" [listOfColumns]="getColumnList()"
      [addRoute]="'produto/cadastro'" [editRoute]="'produto/editar'" [listData]="produtos"
      (deleteEvent)="deletarProduto($event)"></app-custom-table>
  </p-card>
</div>
