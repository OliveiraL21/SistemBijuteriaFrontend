<div class="w-full mt-5 p-4">
  <p-card>
    <h1>Cadastro de Cliente</h1>
    <app-custom-form [form]="form" [controls]="getFormControls()"></app-custom-form>
    <div class="w-full mt-2 flex justify-content-between">
      <app-custom-button [custom]="getCustomButton('Cancelar', false, '', 'danger')"
        (onClickEvent)="voltar()"></app-custom-button>
      <app-custom-button [custom]="getCustomButton('Salvar', false, '', 'primary')"></app-custom-button>
    </div>
  </p-card>
</div>
