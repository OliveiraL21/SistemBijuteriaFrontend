<div class="w-full h-full p-4 mt-5">
  <p-confirmDialog />
  <p-toast />
  <p-blockUI [blocked]="loading">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="8" fill="var(--surface-ground)"
      animationDuration=".5s"></p-progressSpinner>
  </p-blockUI>
  <p-card>
    <app-custom-table [pageTitle]="'Clientes'" [pageName]="'Cliente'" [listOfColumns]="getColumnList()"
      [addRoute]="'cliente/cadastro'" [editRoute]="'cliente/editar'" [listData]="clientes"
      (deleteEvent)="deletar($event)"></app-custom-table>
  </p-card>
</div>
