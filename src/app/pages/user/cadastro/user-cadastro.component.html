<div class="w-full mt-5 p-4">
  <p-toast position="top-right" [key]="'trp'" />
  <p-blockUI [blocked]="loading">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="8" fill="var(--surface-ground)"
      animationDuration=".5s"></p-progressSpinner>
  </p-blockUI>
  <p-card>
    <h1 class="mb-4 -mt-2">Minha Conta</h1>
    <app-custom-form [form]="form" [controls]="getFormControls()" (FileEvent)="changeFile($event)"
      [file]="file"></app-custom-form>
    <div class="w-full flex justify-content-between" style="margin-top: 15%;">
      <app-custom-button [custom]="getCustomButton('Cancelar', false, '', 'danger')"
        (onClickEvent)="voltar()"></app-custom-button>
      <app-custom-button [custom]="getCustomButton('Salvar', false, '', 'primary')"
        (onClickEvent)="submit()"></app-custom-button>
    </div>
  </p-card>
</div>
